name: Pokemon Emerald Android

# Builds the Android APK from the pokeemerald-multiplatform fork (native SDL2
# port of the decomp -- no emulator, no ROM). The upstream fork's own CI only
# builds the GBA ROM, so this is the first thing that actually exercises its
# Android target.

on:
  push:
    branches: [ claude/pokeemerald-android-build-vwgjfo ]
    paths:
      - '.github/workflows/pokeemerald-android.yml'
      - 'android-build/**'
  workflow_dispatch:
    inputs:
      ref:
        description: 'pokeemerald-multiplatform ref to build'
        default: 'master'

env:
  NDK_VERSION: '26.3.11579264'
  SDK_CMAKE_VERSION: '3.22.1'

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # Both ABIs build. arm64-v8a is the one that installs on a 64-bit-only
        # phone; armeabi-v7a is kept because it is the fork's original target
        # and its data output is byte-identical to upstream, which is what
        # catches regressions in the pointer-width port. Neither is allowed to
        # fail. See android-build/ARM64-PORT.md.
        abi: [armeabi-v7a, arm64-v8a]
    name: apk (${{ matrix.abi }})
    steps:
      - uses: actions/checkout@v4

      - name: Install decomp build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils-arm-none-eabi libpng-dev
          # The 64-bit job assembles the game data with the aarch64 binutils.
          sudo apt-get install -y binutils-aarch64-linux-gnu

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # packages:'' is required. The action otherwise defaults to installing
      # "tools", a package that has been removed from the SDK repository, and
      # sdkmanager exits 1 on "Failed to find package 'tools'".
      - uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install NDK and CMake
        run: |
          sdkmanager --install "platform-tools" \
                               "ndk;${NDK_VERSION}" \
                               "cmake;${SDK_CMAKE_VERSION}"

      - name: Build APK
        run: ./android-build/build-android.sh
        env:
          REPO_REF: ${{ github.event.inputs.ref || 'master' }}
          POKEEMERALD_ABI: ${{ matrix.abi }}

      # NO_MATCHING_ABIS is an install-time failure with no build-time symptom:
      # the APK builds fine, it just carries native libraries for an ABI the
      # device does not have. A 64-bit-only phone (Pixel 7 and similar) rejects
      # an armeabi-v7a-only APK outright. Assert the packaged ABI here so that
      # never has to be discovered on the device again.
      - name: Verify packaged ABI
        env:
          EXPECTED_ABI: ${{ matrix.abi }}
        run: |
          APK=.pokeemerald-multiplatform/android/app/build/outputs/apk/debug/app-debug.apk
          echo "== native libraries =="
          unzip -l "$APK" | grep 'lib/' || true
          FOUND=$(unzip -l "$APK" | sed -n 's#.*lib/\([^/]*\)/.*#\1#p' | sort -u | tr '\n' ' ')
          FOUND=${FOUND% }
          echo "packaged ABIs: '$FOUND'  expected: '$EXPECTED_ABI'"
          if [ "$FOUND" != "$EXPECTED_ABI" ]; then
            echo "ERROR: APK packages '$FOUND', expected exactly '$EXPECTED_ABI'" >&2
            exit 1
          fi
          if ! unzip -l "$APK" | grep -q "lib/$EXPECTED_ABI/libmain.so"; then
            echo "ERROR: libmain.so missing from lib/$EXPECTED_ABI/" >&2
            exit 1
          fi
          echo "OK: $EXPECTED_ABI, libmain.so present"

      # The on-screen crash reporter prints addresses as an offset from main().
      # Keeping the unstripped library makes those resolvable with addr2line,
      # which is the whole point of printing them.
      - name: Upload unstripped library for symbolizing
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: libmain-unstripped-${{ matrix.abi }}
          path: .pokeemerald-multiplatform/android/app/build/intermediates/cxx/**/libmain.so
          if-no-files-found: warn

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pokeemerald-debug-apk-${{ matrix.abi }}
          path: .pokeemerald-multiplatform/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ matrix.abi }}
          path: |
            .pokeemerald-multiplatform/android-build.log
            .pokeemerald-multiplatform/android/app/build/outputs/logs/**
            .pokeemerald-multiplatform/android/app/.cxx/**/*.log
          if-no-files-found: ignore

  # Builds the fork as a native 64-bit x86-64 binary and actually runs it. This
  # is the only runtime coverage available without an arm64 device: the desktop
  # 64-bit build uses the same widened game data, the same sizeof(void *)
  # readers and the same struct layouts as the arm64-v8a APK, so a pointer-width
  # bug that would crash on the phone crashes here too. Four such bugs were
  # found this way, all of which built and linked cleanly. See ARM64-PORT.md.
  native64:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    name: native x86-64 (runtime check)
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils-arm-none-eabi \
                                  libpng-dev libsdl2-dev libsdl2-image-dev

      - name: Build and run
        run: ./android-build/build-native64.sh

  # Publishes the APKs as assets on a rolling "latest" release, so they have a
  # permanent direct download link that needs no GitHub login and is not a zip:
  #   .../releases/latest/download/pokeemerald-arm64-v8a.apk
  # A CI artifact is login-gated, expires after 90 days and downloads as a zip
  # that Android will not open, which makes it awkward to install on a phone.
  #
  # Gated on every build job passing, including the runtime check, so a release
  # is never published for a build that is known to crash.
  release:
    runs-on: ubuntu-latest
    needs: [apk, native64]
    if: success()
    permissions:
      contents: write
    name: publish release
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: pokeemerald-debug-apk-*
          path: apks

      # Both artifacts contain a file called app-debug.apk, so give them names
      # that say which ABI they are before they become release assets.
      - name: Name the assets by ABI
        run: |
          mkdir -p out
          for abi in arm64-v8a armeabi-v7a; do
            src="apks/pokeemerald-debug-apk-$abi/app-debug.apk"
            [ -f "$src" ] || { echo "missing $src" >&2; exit 1; }
            cp "$src" "out/pokeemerald-$abi.apk"
          done
          ls -la out/
          sha256sum out/*.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          prerelease: true
          body: |
            Debug builds of the native SDL2 port. No emulator, no commercial ROM.

            **On a phone, use `pokeemerald-arm64-v8a.apk`.** `armeabi-v7a` is
            32-bit and will not install on a 64-bit-only device.

            Built from `${{ github.sha }}`. Debug-signed, so Android will ask
            you to allow installing from an unknown source.

            Verified in CI: each APK packages exactly its own ABI, and the
            64-bit code runs headless without crashing. Rendering, input,
            battles and saving are not covered by any automated check.
          files: out/*.apk
